<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Poll</title>
  <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
  <div class="app">
    <h1>Create Poll</h1>
    <div class="form-panel">
      <div class="field">
        <label for="title">Poll Title</label>
        <input type="text" id="title" placeholder="e.g., What do we play next?" required>
      </div>
      <div class="field">
        <label for="channel_id">Channel ID</label>
        <input type="text" id="channel_id" placeholder="Twitch channel ID" required>
      </div>
      <div class="field">
        <label for="candidates">Candidates</label>
        <textarea id="candidates" placeholder="Enter one candidate per line"></textarea>
        <span class="hint">One candidate per line. Blank lines are ignored.</span>
      </div>
      <div class="status" id="status"></div>
      <button class="submit-btn" id="submit-btn">Create Poll</button>
    </div>
  </div>

  <script>
    document.getElementById('submit-btn').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const channel_id = document.getElementById('channel_id').value.trim();
      const raw = document.getElementById('candidates').value;
      const candidates = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const statusEl = document.getElementById('status');

      if (!title || !channel_id || candidates.length === 0) {
        statusEl.textContent = 'Please fill in all fields and provide at least one candidate.';
        statusEl.className = 'status error';
        statusEl.style.display = 'block';
        return;
      }

      const body = new URLSearchParams();
      body.set('title', title);
      body.set('channel_id', channel_id);
      body.set('candidates', JSON.stringify(candidates));

      try {
        const resp = await fetch('{{url_for("create")}}', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: body.toString(),
        });
        if (resp.ok) {
          statusEl.textContent = 'Poll created successfully.';
          statusEl.className = 'status success';
        } else {
          const text = await resp.text();
          statusEl.textContent = `Error ${resp.status}: ${text}`;
          statusEl.className = 'status error';
        }
      } catch (e) {
        statusEl.textContent = `Request failed: ${e.message}`;
        statusEl.className = 'status error';
      }
      statusEl.style.display = 'block';
    });
  </script>
</body>
</html>
