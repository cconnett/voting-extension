<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranked Choice Voting</title>
  <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
  <div class="app">
    <h1>{{title}}</h1>
    <div class="columns">
      <div class="panel">
        <div class="panel-title">Candidates</div>
        <div class="list" id="candidates">
            {% for candidate in candidates %}
            <div class="candidate" data-id="{{candidate}}">{{candidate}}</div>
            {% endfor %}
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Your Ranking</div>
        <div class="drop-zone" id="ballot">
          <span class="empty-hint" id="ballot-hint">Click a candidate to rank them</span>
            {% for candidate in ranking %}
            <div class="candidate" data-id="{{candidate}}">{{candidate}}</div>
            {% endfor %}
        </div>
      </div>
    </div>
    <div class="submit-area">
      <span class="submit-status" id="submit-status"></span>
      <button class="submit-btn" id="submit-btn">Submit Vote</button>
    </div>
  </div>

  <script>
    const DUMMY_TOKEN = 'dummy_token';
    const CAST_VOTE_URL = '{{url_for("cast_vote", poll_id=request.view_args.poll_id)}}';

    const candidatesEl = document.getElementById('candidates');
    const ballotEl     = document.getElementById('ballot');
    const hint         = document.getElementById('ballot-hint');
    const submitBtn    = document.getElementById('submit-btn');
    const statusEl     = document.getElementById('submit-status');

    let draggedItem = null;
    let lastSubmittedRanking = null; // null = never submitted this session

    // Convert any pre-rendered ranking items (from server) to interactive ballot-items.
    {
      const preRanked = [...ballotEl.querySelectorAll('.candidate')];
      if (preRanked.length > 0) {
        hint.remove();
        preRanked.forEach(el => el.replaceWith(createBallotItem(el.dataset.id, el.textContent.trim())));
        updateRanks();
        lastSubmittedRanking = getCurrentRanking();
        setVotedState();
      }
    }

    candidatesEl.addEventListener('click', e => {
      const candidate = e.target.closest('.candidate');
      if (!candidate) return;
      moveToBallot(candidate);
    });

    submitBtn.addEventListener('click', submitVote);

    // --- ballot manipulation ---

    function createBallotItem(id, text) {
      const item = document.createElement('div');
      item.className = 'ballot-item';
      item.draggable = true;
      item.dataset.id = id;

      const rank = document.createElement('span');
      rank.className = 'rank-num';

      const label = document.createElement('span');
      label.textContent = text;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', () => removeFromBallot(item));

      item.append(rank, label, removeBtn);
      attachDragEvents(item);
      return item;
    }

    function moveToBallot(candidate) {
      hint.remove();
      ballotEl.appendChild(createBallotItem(candidate.dataset.id, candidate.textContent.trim()));
      candidate.remove();
      updateRanks();
      onBallotChange();
    }

    function removeFromBallot(item) {
      const id   = item.dataset.id;
      const text = item.querySelectorAll('span')[1].textContent;
      item.remove();

      const restored = document.createElement('div');
      restored.className = 'candidate';
      restored.dataset.id = id;
      restored.textContent = text;
      candidatesEl.appendChild(restored);

      updateRanks();
      if (ballotEl.querySelectorAll('.ballot-item').length === 0) {
        ballotEl.appendChild(hint);
      }
      onBallotChange();
    }

    function attachDragEvents(item) {
      item.addEventListener('dragstart', e => {
        draggedItem = item;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => item.classList.add('dragging'), 0);
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.querySelectorAll('.ballot-item').forEach(i => i.classList.remove('drag-over'));
        draggedItem = null;
        updateRanks();
        onBallotChange();
      });

      item.addEventListener('dragover', e => {
        e.preventDefault();
        if (!draggedItem || draggedItem === item) return;
        item.classList.add('drag-over');
        const rect = item.getBoundingClientRect();
        ballotEl.insertBefore(draggedItem, e.clientY < rect.top + rect.height / 2 ? item : item.nextSibling);
      });

      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

      item.addEventListener('drop', e => {
        e.preventDefault();
        item.classList.remove('drag-over');
      });
    }

    function updateRanks() {
      ballotEl.querySelectorAll('.ballot-item').forEach((item, i) => {
        item.querySelector('.rank-num').textContent = `${i + 1}.`;
      });
    }

    // --- submit state ---

    function getCurrentRanking() {
      return [...ballotEl.querySelectorAll('.ballot-item')].map(i => i.dataset.id);
    }

    function arraysEqual(a, b) {
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }

    function setVotedState() {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Voted!';
      statusEl.textContent = '';
      statusEl.className = 'submit-status';
    }

    function onBallotChange() {
      if (lastSubmittedRanking === null) return;
      if (arraysEqual(getCurrentRanking(), lastSubmittedRanking)) {
        setVotedState();
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Vote';
        statusEl.textContent = '';
        statusEl.className = 'submit-status';
      }
    }

    // --- network ---

    async function submitVote() {
      const ranking = getCurrentRanking();
      const rankingDict = {};
      ranking.forEach((id, i) => { rankingDict[id] = i + 1; });

      submitBtn.disabled = true;
      statusEl.textContent = 'Submitting...';
      statusEl.className = 'submit-status pending';

      const body = new URLSearchParams();
      body.set('token', DUMMY_TOKEN);
      body.set('ranking', JSON.stringify(rankingDict));

      try {
        const resp = await fetch(CAST_VOTE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: body.toString(),
        });
        if (resp.ok) {
          lastSubmittedRanking = ranking;
          setVotedState();
        } else {
          submitBtn.disabled = false;
          statusEl.textContent = `Error ${resp.status}`;
          statusEl.className = 'submit-status error';
        }
      } catch (e) {
        submitBtn.disabled = false;
        statusEl.textContent = 'Request failed';
        statusEl.className = 'submit-status error';
      }
    }
  </script>
</body>
</html>
